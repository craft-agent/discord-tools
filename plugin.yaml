name: discord-tools
version: 1.1.0
description: "Discord tools for coding agents: chats, messages, search, inbox, files, sends and roles."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - discord_account_read
  - discord_chat_read
  - discord_export_create
  - discord_file_post
  - discord_file_save
  - discord_file_send
  - discord_grant_create
  - discord_grant_read
  - discord_grant_revoke
  - discord_history_read
  - discord_inbox_read
  - discord_message_delete
  - discord_message_edit
  - discord_message_send
  - discord_people_read
  - discord_pin_add
  - discord_pin_remove
  - discord_post_create
  - discord_reaction_add
  - discord_reaction_remove
  - discord_read_mark
  - discord_role_assign
  - discord_role_create
  - discord_role_delete
  - discord_role_edit
  - discord_role_read
  - discord_role_unassign
  - discord_saved_add
  - discord_saved_remove
  - discord_search_read
  - discord_server_read
  - discord_sync_add
  - discord_sync_read
  - discord_sync_remove
  - discord_thread_create
  - discord_thread_join
  - discord_thread_leave
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  unattended:
    type: bool
    description: "No person can answer: writes run only under a grant that covers them."
  grants_dir:
    type: str
    description: Where grants and their use are kept; default under the user's state directory.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  require_plugins:
    type: list
    description: The Hermes plugins that must be loaded; while one is not, every write is refused before it is approved.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
  state_dir:
    description: Absolute path to every label's state. Defaults to $XDG_STATE_HOME/discord-tools when XDG_STATE_HOME is absolute, else ~/.local/state/discord-tools. A blank path uses the default.
  download_dir:
    description: Absolute path for received files, with exports in exports/. Defaults to ~/Downloads/discord-tools. A blank path uses the default.
  download_max_mb:
    type: int
    description: Whole megabytes per received file, from 1 to 500. Defaults to 100.
  send_dirs:
    type: list
    description: Up to 20 absolute directories files may be sent from. Blank items are dropped. Defaults to the working directory when unset.
  send_max_mb:
    type: int
    description: Whole megabytes per sent file, from 1 to 500. Defaults to 10.
